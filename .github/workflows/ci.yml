name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка Ruff
        run: pip install -e ".[dev]"

      - name: Проверка линтером
        run: ruff check .

      - name: Проверка форматирования
        run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -e ".[dev]"

      - name: Запуск тестов
        run: pytest -q

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -e ".[dev]"

      - name: Регенерация openapi.json
        run: python scripts/export_openapi.py

      - name: Проверка синхронности контракта
        run: |
          git diff --exit-code docs/openapi.json \
            || (echo "::error::docs/openapi.json устарел — выполните 'python scripts/export_openapi.py' и закоммитьте результат" && exit 1)
